<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pixel Pad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2230%22%20height%3D%2230%22%20rx%3D%227%22%20fill%3D%22%23FBF6EE%22%20stroke%3D%22rgba%2844%2C39%2C64%2C0.12%29%22%20stroke-width%3D%221%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%224%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23FF7A45%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%224%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23FFC24B%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%235B8DEF%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2210%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%2314B8A6%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%2216%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23FF6B6B%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2216%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%233FB27F%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%2222%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23FFC24B%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2222%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221%22%20fill%3D%22%23FF7A45%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root{
    --paper:#FBF6EE; --card:#FFFFFF; --ink:#2C2740; --muted:#7A7488;
    --line:#EAE3D8; --accent:#FF7A45; --accent-ink:#FFFFFF; --teal:#14B8A6;
    --teal-ink:#06312B; --canvas-paper:#FFFFFF; --canvas-grid:rgba(24,20,34,0.07);
    --shadow:rgba(44,39,64,0.14); --chip-ring:rgba(44,39,64,0.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141319; --card:#22212B; --ink:#F3EFE9; --muted:#ABA4B7;
      --line:#34313C; --accent:#FF8A5C; --accent-ink:#2A1206; --teal:#2DD4BF;
      --teal-ink:#06312B; --canvas-paper:#FFFFFF; --canvas-grid:rgba(24,20,34,0.08);
      --shadow:rgba(0,0,0,0.5); --chip-ring:rgba(255,255,255,0.22);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141319; --card:#22212B; --ink:#F3EFE9; --muted:#ABA4B7;
    --line:#34313C; --accent:#FF8A5C; --accent-ink:#2A1206; --teal:#2DD4BF;
    --teal-ink:#06312B; --canvas-paper:#FFFFFF; --canvas-grid:rgba(24,20,34,0.08);
    --shadow:rgba(0,0,0,0.5); --chip-ring:rgba(255,255,255,0.22);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Nunito",system-ui,sans-serif; line-height:1.4;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  body.panning canvas{cursor:grab}

  .app-shell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  .editor{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  @media (min-width:700px){ .editor{flex-direction:row} }

  .tabbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0}
  .tab{flex:0 0 auto;display:flex;align-items:stretch;border:2px solid var(--line);background:transparent;border-radius:10px;overflow:hidden}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
  .tabname{font-family:inherit;font-weight:800;font-size:.78rem;color:var(--ink);background:none;border:none;cursor:pointer;padding:7px 9px 7px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .tab[aria-selected="true"] .tabname{color:var(--accent-ink);text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.65)}
  .tabx{font-family:inherit;background:none;border:none;border-left:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:.8rem;font-weight:800;padding:6px 10px;line-height:1;align-self:stretch}
  .tab[aria-selected="true"] .tabx{color:var(--accent-ink);border-left-color:rgba(255,255,255,.4);opacity:.9}
  .tabedit{font-family:inherit;font-weight:800;font-size:.78rem;border:none;background:var(--card);color:var(--ink);padding:7px 8px 7px 12px;width:112px;max-width:130px;border-radius:8px;outline:2px solid var(--teal)}
  .newtab{flex:0 0 auto;width:36px;height:36px;border-radius:10px;border:2px dashed var(--line);background:transparent;color:var(--muted);font-size:1.2rem;font-weight:800;cursor:pointer}

  .stage{
    position:relative;flex:1 1 auto;min-height:0;min-width:0;
    display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;
  }
  canvas{
    display:block;border-radius:10px;transform-origin:center center;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:var(--canvas-paper);touch-action:none;cursor:crosshair;
    box-shadow:0 8px 30px -10px var(--shadow), 0 0 0 1px rgba(0,0,0,0.06);
  }
  .theme-btn{
    position:absolute;top:12px;right:12px;z-index:3;
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    width:40px;height:40px;border-radius:11px;font-size:1.1rem;cursor:pointer;
    display:grid;place-items:center;box-shadow:0 4px 12px -6px var(--shadow);
  }
  .zoom-reset{
    position:absolute;left:12px;bottom:12px;z-index:3;display:none;
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    font-family:inherit;font-weight:800;font-size:.78rem;padding:7px 12px;border-radius:999px;
    cursor:pointer;box-shadow:0 4px 12px -6px var(--shadow);align-items:center;gap:6px;
  }
  .zoom-reset.show{display:inline-flex}
  .selmenu{
    position:absolute;z-index:6;display:none;left:0;top:0;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:4px;gap:2px;box-shadow:0 10px 26px -8px var(--shadow), 0 0 0 1px rgba(0,0,0,.04);
    white-space:nowrap;
  }
  .selmenu.show{display:inline-flex}
  .selmenu::after{content:"";position:absolute;left:50%;width:10px;height:10px;background:var(--card);border:1.5px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  .selmenu[data-pos="above"]::after{bottom:-6px;border-top:none;border-left:none}
  .selmenu[data-pos="below"]::after{top:-6px;border-bottom:none;border-right:none}
  .selmenu button{
    font-family:inherit;font-weight:800;font-size:.74rem;cursor:pointer;
    border:none;background:transparent;color:var(--ink);border-radius:8px;
    padding:6px 9px;display:inline-flex;align-items:center;gap:5px;position:relative;z-index:1;
  }
  .selmenu button:hover{background:var(--paper)}
  .selmenu button.danger{color:#e2483d}
  .selmenu .mi{font-size:.95rem;line-height:1}
  .paste-hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    display:none;background:var(--teal);color:var(--teal-ink);
    font-weight:800;font-size:.8rem;padding:8px 14px;border-radius:999px;
    box-shadow:0 6px 16px -6px var(--shadow);max-width:92%;text-align:center;z-index:4;
  }
  .paste-hint.show{display:block}

  .toolbar{
    flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);
    padding:11px 12px;display:flex;flex-direction:column;gap:10px;
    max-height:50vh;overflow:auto;
  }
  @media (min-width:700px){
    .toolbar{width:168px;border-top:none;border-left:1px solid var(--line);max-height:none;height:100%}
  }

  .blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
  @media (min-width:700px){ .toolbar .blocks{grid-template-columns:repeat(2,1fr)} }
  .blocks.primary{grid-template-columns:repeat(3,1fr)}
  .more-btn .ic{font-size:1.45rem;line-height:1}
  .more-wrap{display:flex;flex-direction:column;gap:10px}
  @media (min-width:700px){
    #moreToolsBtn{display:none}
    #moreTools[hidden]{display:flex!important}
    .toolbar .blocks.primary{grid-template-columns:repeat(2,1fr)}
  }
  .blk{
    font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:54px;padding:6px 3px;
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:14px;cursor:pointer;
    transition:transform .06s ease,background .15s,border-color .15s;
  }
  .blk .ic{font-size:1.35rem;line-height:1;display:flex;align-items:center;justify-content:center}
  .blk .ic svg{width:22px;height:22px;display:block}
  .blk .lb{font-size:.62rem;font-weight:800;letter-spacing:.2px}
  .blk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  #gridBtn[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
  .blk:disabled{opacity:.36;cursor:default}
  @media (prefers-reduced-motion:no-preference){ button:active{transform:translateY(2px)} }
  button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  .divider{height:2px;background:var(--line);border:none;border-radius:2px;margin:2px 0}

  .colors{display:flex;flex-direction:column;gap:9px}
  .colorbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .current .chip{width:34px;height:34px;border-radius:10px;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--chip-ring)}
  .custom{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:.8rem;color:var(--muted);cursor:pointer}
  .custom input{width:34px;height:34px;border:none;background:none;padding:0;cursor:pointer;border-radius:9px}
  .swatches{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
  @media (min-width:700px){ .toolbar .swatches{grid-template-columns:repeat(6,1fr)} }
  .sw{aspect-ratio:1;border-radius:8px;border:none;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);transition:transform .06s ease}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--ink);transform:scale(1.06);position:relative;z-index:1}
  .morecolors{width:100%;font-family:inherit;font-weight:800;font-size:.76rem;cursor:pointer;border:2px dashed var(--line);background:transparent;color:var(--muted);border-radius:11px;padding:9px;display:flex;align-items:center;justify-content:center;gap:8px}
  .ramps{display:flex;flex-direction:column;gap:5px;margin-top:3px}
  .ramp{display:flex;gap:5px}
  .ramp .sw{flex:1 1 0;min-width:0}
  [hidden]{display:none!important}

  .dims{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap}
  .dim{display:flex;flex-direction:column;gap:3px}
  .dimlab{font-size:.58rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding-left:3px}
  .dims input{
    font-family:inherit;font-weight:800;font-size:.92rem;width:54px;padding:5px 3px;text-align:center;
    border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:36px;
  }
  .dimx{color:var(--muted);font-weight:800;font-size:1rem;padding-bottom:8px}

  .saverow{display:flex;flex-direction:column}
  button.save{
    width:100%;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;
    background:var(--teal);color:var(--teal-ink);border:2px solid var(--teal);
    border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .save .ic{font-size:1.15rem}
  .scale-opts{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .scale-opts button{
    width:48px;height:48px;border-radius:50%;padding:0;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:.8rem;
    border:2px solid var(--teal);background:transparent;color:var(--teal);
    display:flex;align-items:center;justify-content:center;
  }
  .scale-opts .close{border-color:var(--line);color:var(--muted);font-size:1.05rem}

  .overlay{position:fixed;inset:0;background:rgba(20,16,30,0.6);display:none;place-items:center;padding:20px;z-index:40}
  .overlay.open{display:grid}
  .modal{background:var(--card);border-radius:20px;padding:20px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 50px -10px rgba(0,0,0,0.55)}
  .modal h2{font-family:"Baloo 2",sans-serif;margin:0 0 4px;font-size:1.35rem}
  .modal p{margin:0 0 14px;color:var(--muted);font-size:.9rem;font-weight:600}
  .modal img{width:100%;max-width:320px;border-radius:12px;image-rendering:pixelated;box-shadow:0 6px 16px -6px var(--shadow);margin:0 auto 16px;background:#fff}
  .modal button{font-family:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 18px;cursor:pointer;min-height:44px}
</style>

<div class="app-shell">
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="newtab" id="newTab" title="New artwork" aria-label="New artwork">＋</button>
  </div>
  <div class="editor">
  <div class="stage" id="stage">
    <canvas id="canvas" width="320" height="320" aria-label="Pixel drawing canvas"></canvas>
    <button class="theme-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark mode">🌙</button>
    <button class="zoom-reset" id="zoomReset" title="Reset zoom (0)">🔍 <span id="zoomPct">100%</span></button>
    <div class="selmenu" id="selMenu" role="toolbar" aria-label="Selection actions">
      <button data-act="copy" title="Copy (Ctrl+C)"><span class="mi">📋</span>Copy</button>
      <button data-act="mirror" title="Mirror left–right (H)"><span class="mi">⇆</span>Mirror</button>
      <button data-act="flip" title="Flip top–bottom (V)"><span class="mi">⇅</span>Flip</button>
      <button data-act="delete" class="danger" title="Delete (Del)"><span class="mi">🗑</span>Delete</button>
    </div>
    <div class="paste-hint" id="pasteHint">Aim over the canvas, then tap to stamp 📌</div>
  </div>

  <div class="toolbar">
    <div class="blocks primary" role="group" aria-label="Drawing tools">
      <button class="blk tool" data-tool="pencil" aria-pressed="true" title="Draw (D)"><span class="ic">✏️</span><span class="lb">Draw</span></button>
      <button class="blk tool" data-tool="eraser" aria-pressed="false" title="Erase (E)"><span class="ic">🧽</span><span class="lb">Erase</span></button>
      <button class="blk more-btn" id="moreToolsBtn" type="button" aria-expanded="false" aria-controls="moreTools" title="Show more tools"><span class="ic">⋯</span><span class="lb">More</span></button>
    </div>

    <div class="more-wrap" id="moreTools" hidden>
    <div class="blocks" role="group" aria-label="More tools">
      <button class="blk tool" data-tool="fill" aria-pressed="false" title="Fill (F)"><span class="ic">🪣</span><span class="lb">Fill</span></button>
      <button class="blk tool" data-tool="eyedropper" aria-pressed="false" title="Pick colour (I) — hold Alt/Option while drawing to pick"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></span><span class="lb">Pick</span></button>
      <button class="blk tool" data-tool="select" aria-pressed="false" title="Select (S)"><span class="ic">🔲</span><span class="lb">Select</span></button>
    </div>

    <hr class="divider">

    <div class="blocks">
      <button class="blk" id="undoBtn" title="Undo (Ctrl+Z)"><span class="ic">↩️</span><span class="lb">Undo</span></button>
      <button class="blk" id="redoBtn" title="Redo (Ctrl+Y)"><span class="ic">↪️</span><span class="lb">Redo</span></button>
      <button class="blk" id="pasteBtn" title="Paste (Ctrl+V)"><span class="ic">📌</span><span class="lb">Paste</span></button>
      <button class="blk" id="gridBtn" aria-pressed="true" title="Grid (G)"><span class="ic">▦</span><span class="lb">Grid</span></button>
      <button class="blk" id="clearBtn" title="Clear all"><span class="ic">🗑️</span><span class="lb">Clear</span></button>
    </div>
    </div>

    <hr class="divider">

    <div class="colors">
      <div class="colorbar">
        <div class="current"><span class="chip" id="currentChip"></span></div>
        <label class="custom"><input type="color" id="customColor" value="#7C4DE0"> Custom</label>
      </div>
      <div class="swatches" id="swatches"></div>
      <button class="morecolors" id="moreColors" aria-expanded="false"><span>More colours for shading</span><span id="moreArrow">▾</span></button>
      <div class="ramps" id="ramps" hidden></div>
    </div>

    <hr class="divider">

    <div class="dims">
      <div class="dim"><span class="dimlab">Width</span><input type="number" id="dimW" min="2" max="160" value="16" aria-label="Width in pixels"></div>
      <span class="dimx">×</span>
      <div class="dim"><span class="dimlab">Height</span><input type="number" id="dimH" min="2" max="160" value="16" aria-label="Height in pixels"></div>
    </div>

    <div class="saverow">
      <button class="save" id="saveBtn" title="Save (Ctrl+S downloads 16×)"><span class="ic">💾</span>Save</button>
      <div class="scale-opts" id="scaleOpts" hidden>
        <button data-x="1" title="Download 1× (tiny)">1×</button>
        <button data-x="2" title="Download 2×">2×</button>
        <button data-x="16" title="Download 16× (biggest)">16×</button>
        <button class="close" id="scaleClose" title="Cancel">✕</button>
      </div>
    </div>
  </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Ta-da! 🎉</h2>
    <p>Press and hold (or right-click) the picture to save it.</p>
    <img id="saveImg" alt="Your pixel art">
    <button id="closeModal">Keep drawing</button>
  </div>
</div>

  var LS=[85,71,58,45,33], SS=[62,73,79,74,66];
  var ramps=[];
  HUES.forEach(function(h){ var a=[]; for(var i=0;i<5;i++) a.push(hslHex(h,SS[i],LS[i])); ramps.push(a); });
  var grays=["#FFFFFF"]; [92,81,70,59,48,37,26,15].forEach(function(l){ grays.push(hslHex(0,0,l)); }); grays.push("#000000"); ramps.push(grays);
  ramps.push(["#FDE3CE","#F1C6A0","#DDA579","#BE8154","#8F5E3B","#5E3B24"]);
  ramps.forEach(function(r){
    var row=document.createElement("div"); row.className="ramp";
    r.forEach(function(col){ makeSwatch(col, row); });
    rampsWrap.appendChild(row);
  });

  var moreColors=document.getElementById("moreColors");
  var moreArrow=document.getElementById("moreArrow");
  moreColors.addEventListener("click", function(){
    var open=rampsWrap.hidden;
    rampsWrap.hidden=!open;
    moreColors.setAttribute("aria-expanded", open?"true":"false");
    moreArrow.textContent = open ? "▴" : "▾";
  });

  var customColor=document.getElementById("customColor");
  customColor.addEventListener("input", function(){ pickColor(customColor.value); });

  // ---- save picture ----
  var overlay=document.getElementById("overlay");
  function renderExport(ex){
    var off=document.createElement("canvas");
    off.width=cols*ex; off.height=rows*ex;
    var octx=off.getContext("2d");
    octx.fillStyle="#FFFFFF"; octx.fillRect(0,0,off.width,off.height);
    for(var i=0;i<model.length;i++){
      if(model[i]){ octx.fillStyle=model[i]; octx.fillRect((i%cols)*ex, Math.floor(i/cols)*ex, ex, ex); }
    }
    return off;
  }
  var canDownload = (window.self===window.top); // sandboxed artifact frames block downloads
  function triggerDownload(url){
    var a=document.createElement("a");
    a.href=url; a.download="my-pixel-art.png";
    document.body.appendChild(a); a.click(); a.remove();
  }
  function showSaveModal(off){
    document.getElementById("saveImg").src=off.toDataURL("image/png");
    overlay.classList.add("open");
  }
  function downloadScale(ex){
    var off=renderExport(ex);
    if(!canDownload){ showSaveModal(off); return; }   // shared artifact: fall back to press-and-hold image
    if(off.toBlob){
      off.toBlob(function(blob){
        if(!blob){ showSaveModal(off); return; }
        var url=URL.createObjectURL(blob);
        triggerDownload(url);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      }, "image/png");
    } else {
      triggerDownload(off.toDataURL("image/png"));
    }
  }
  var saveBtn=document.getElementById("saveBtn");
  var scaleOpts=document.getElementById("scaleOpts");
  function openScale(){ saveBtn.hidden=true; scaleOpts.hidden=false; }
  function closeScale(){ scaleOpts.hidden=true; saveBtn.hidden=false; }
  saveBtn.addEventListener("click", openScale);
  scaleOpts.querySelectorAll("button[data-x]").forEach(function(b){
    b.addEventListener("click", function(){ downloadScale(+b.dataset.x); closeScale(); });
  });
  document.getElementById("scaleClose").addEventListener("click", closeScale);
  document.getElementById("closeModal").addEventListener("click", function(){ overlay.classList.remove("open"); });
  overlay.addEventListener("click", function(e){ if(e.target===overlay) overlay.classList.remove("open"); });

  // ---- keyboard ----
  document.addEventListener("keydown", function(e){
    var tag=(e.target.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea") return;
    var k=e.key.toLowerCase();
    if(e.key==="Alt"){ if(!altHeld){ altHeld=true; updateCursor(); } e.preventDefault(); return; }
    if(e.ctrlKey||e.metaKey){
      if(k==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); }
      else if(k==="y"){ e.preventDefault(); redo(); }
      else if(k==="c"){ e.preventDefault(); doCopy(); }
      else if(k==="v"){ e.preventDefault(); enterPaste(); }
      else if(k==="x"){ e.preventDefault(); if(selection){ doCopy(); deleteSelection(); } }
      else if(k==="s"){ e.preventDefault(); downloadScale(16); }
      return;
    }
    if(e.key===" "){ spaceHeld=true; e.preventDefault(); document.body.classList.add("panning"); return; }
    if(k==="delete"||k==="backspace"){ if(selection){ e.preventDefault(); deleteSelection(); } return; }
    if(k==="d") selectTool("pencil");
    else if(k==="e") selectTool("eraser");
    else if(k==="f") selectTool("fill");
    else if(k==="s") selectTool("select");
    else if(k==="i") selectTool("eyedropper");
    else if(k==="g") toggleGrid();
    else if(k==="c") doCopy();
    else if(k==="p") enterPaste();
    else if(k==="h") flip(true);
    else if(k==="v") flip(false);
    else if(k==="escape"){ if(!scaleOpts.hidden) closeScale(); else if(pasteMode) selectTool(tool); }
    else if(k==="+"||k==="=") zoomCenter(1.15);
    else if(k==="-"||k==="_") zoomCenter(1/1.15);
    else if(k==="0") resetView();
  });
  document.addEventListener("keyup", function(e){
    if(e.key===" "){ spaceHeld=false; document.body.classList.remove("panning"); }
    else if(e.key==="Alt"){ altHeld=false; updateCursor(); }
  });
  window.addEventListener("blur", function(){ altHeld=false; spaceHeld=false; document.body.classList.remove("panning"); updateCursor(); });

  // ---- theme (dark by default) ----
  var themeBtn=document.getElementById("themeBtn");
  function applyThemeIcon(){
    var t=document.documentElement.getAttribute("data-theme");
    var dark = t==="dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
    themeBtn.textContent = dark ? "☀️" : "🌙";
  }
  try{
    var st=localStorage.getItem("pixelpad-theme");
    document.documentElement.setAttribute("data-theme", st ? st : "dark");
  }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  themeBtn.addEventListener("click", function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var dark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try{ localStorage.setItem("pixelpad-theme", next); }catch(e){}
    applyThemeIcon(); render();
  });

  // ---- artworks (tabs) ----
  var tabsWrap=document.getElementById("tabs");
  var newTabBtn=document.getElementById("newTab");
  var editingId=null;
  function renderTabs(){
    tabsWrap.innerHTML="";
    projects.forEach(function(p){
      var t=document.createElement("div"); t.className="tab"; t.dataset.id=p.id;
      t.setAttribute("role","tab"); t.setAttribute("aria-selected", p.id===activeId?"true":"false");
      if(p.id===editingId){
        var inp=document.createElement("input"); inp.className="tabedit"; inp.value=p.name; inp.maxLength=24;
        inp.setAttribute("aria-label","Artwork name");
        inp.addEventListener("keydown", function(e){
          if(e.key==="Enter"){ e.preventDefault(); inp.blur(); }
          else if(e.key==="Escape"){ e.preventDefault(); editingId=null; renderTabs(); }
        });
        inp.addEventListener("blur", function(){
          if(editingId!==p.id) return;
          var v=inp.value.trim().slice(0,24); if(v) p.name=v;
          editingId=null; renderTabs(); save();
        });
        t.appendChild(inp); tabsWrap.appendChild(t);
        setTimeout(function(){ inp.focus(); inp.select(); }, 0);
        return;
      }
      var nm=document.createElement("button"); nm.className="tabname"; nm.textContent=p.name;
      nm.title = (p.id===activeId) ? "Click to rename" : ("Open “"+p.name+"”");
      nm.addEventListener("click", function(){
        if(p.id===activeId){ editingId=p.id; renderTabs(); } else { switchTo(p.id); }
      });
      var x=document.createElement("button"); x.className="tabx"; x.textContent="✕"; x.title="Close artwork";
      x.addEventListener("click", function(e){ e.stopPropagation(); deleteProject(p.id); });
      t.appendChild(nm); t.appendChild(x); tabsWrap.appendChild(t);
    });
    var cur=tabsWrap.querySelector('.tab[aria-selected="true"]');
    if(cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest",inline:"nearest"});
  }
  function loadProject(p){
    editingId=null;
    useProject(p); selection=null; exitPaste();
    sizeCanvas(); fitCanvas(); resetView(); syncDims();
    renderTabs(); render(); refreshEdit(); save();
  }
  function switchTo(id){
    if(id===activeId) return;
    commitActive(); activeId=id;
    var p=activeProj(); if(p) loadProject(p);
  }
  function newProject(){
    commitActive();
    var p=makeProject(null,16,16,null); projects.push(p); activeId=p.id;
    loadProject(p);
  }
  function deleteProject(id){
    var idx=-1,i; for(i=0;i<projects.length;i++) if(projects[i].id===id) idx=i;
    if(idx<0) return;
    var p=projects[idx];
    if(p.model.some(function(v){return v;}) && !window.confirm('Delete "'+p.name+'"? This can\'t be undone.')) return;
    var wasActive=(id===activeId);
    projects.splice(idx,1);
    if(!projects.length) projects.push(makeProject("Art 1",16,16,null));
    if(wasActive){
      activeId=projects[Math.min(idx,projects.length-1)].id;
      var np=activeProj(); loadProject(np);
    } else { renderTabs(); save(); }
  }
  newTabBtn.addEventListener("click", newProject);

  // ---- keep fitted ----
  if(window.ResizeObserver){ new ResizeObserver(fitCanvas).observe(stage); }
  window.addEventListener("resize", fitCanvas);
  window.addEventListener("orientationchange", function(){ setTimeout(fitCanvas,120); });

  // ---- init ----
  load();
  sizeCanvas(); syncDims(); markColor(); applyThemeIcon(); renderTabs();
  gridBtn.setAttribute("aria-pressed", gridOn?"true":"false");
  customColor.value = /^#[0-9a-fA-F]{6}$/.test(currentColor) ? currentColor : "#7C4DE0";
  refreshEdit(); render(); updateZoomUI(); updateCursor();
  requestAnimationFrame(fitCanvas);
})();
</script>
</html>
